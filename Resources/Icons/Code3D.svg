<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Terminal Background -->
  <rect x="4" y="12" width="40" height="40" rx="4" fill="#2D2D2D" stroke="#A0A0A0" stroke-width="2"/>
  <!-- Teminal Prompt -->
  <text x="10" y="34" font-family="monospace" font-size="16" fill="#4CAF50" font-weight="bold">&gt;_</text>
  
  <!-- 3D Cube -->
  <!-- top face -->
  <polygon points="48,16 58,22 48,28 38,22" fill="#64B5F6" stroke="#1565C0" stroke-width="1.5"/>
  <!-- left face -->
  <polygon points="38,22 48,28 48,44 38,38" fill="#42A5F5" stroke="#1565C0" stroke-width="1.5"/>
  <!-- right face -->
  <polygon points="48,28 58,22 58,38 48,44" fill="#1E88E5" stroke="#1565C0" stroke-width="1.5"/>
</svg>
