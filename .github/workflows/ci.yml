name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-24.04
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Micromamba (Conda)
      uses: mamba-org/setup-micromamba@v1
      with:
        environment-name: freecad-env
        create-args: >-
          -c conda-forge
          freecad=0.21
          python=3.11
          pytest
          pytest-mock
          cadquery

    - name: Install cq_mod3d dependency
      shell: micromamba-shell {0}
      run: |
        pip install git+https://github.com/gwangcode/cq_mod3d.git

    - name: Run Tests with xvfb (Virtual Display)
      shell: micromamba-shell {0}
      env:
        PYTHONPATH: ${{ github.workspace }}
        QT_QPA_PLATFORM: offscreen
        # 关键修复：让 C++ 底层能够找到 FreeCAD 的动态链接库
        LD_LIBRARY_PATH: ${{ env.CONDA_PREFIX }}/lib
      run: |
        # 使用 xvfb-run 提供虚拟显示器，确保底层 C++ 初始化时不报错
        xvfb-run -a pytest tests/ -v
