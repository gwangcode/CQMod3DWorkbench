name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    
    steps:
    - uses: actions/checkout@v4

    - name: Setup Micromamba (Conda)
      uses: mamba-org/setup-micromamba@v1
      with:
        environment-name: freecad-env
        create-args: >-
          -c conda-forge
          freecad=0.21
          python=3.11
          pytest
          pytest-mock
          numpy
          scipy
          trimesh
          shapely

    - name: Run Tests (Linux)
      if: runner.os == 'Linux'
      shell: micromamba-shell {0}
      run: |
        export PYTHONPATH=${{ github.workspace }}:$CONDA_PREFIX/lib/freecad/lib:$CONDA_PREFIX/lib:$CONDA_PREFIX/lib/python3.11/site-packages:$PYTHONPATH
        export LD_LIBRARY_PATH=$CONDA_PREFIX/lib:$CONDA_PREFIX/lib/freecad/lib:$LD_LIBRARY_PATH
        export QT_QPA_PLATFORM=offscreen
        xvfb-run -a pytest tests/ -v

    - name: Run Tests (Windows)
      if: runner.os == 'Windows'
      shell: bash -l {0}
      run: |
        export PYTHONPATH="${{ github.workspace }};$CONDA_PREFIX/Library/lib;$CONDA_PREFIX/Lib/site-packages"
        pytest tests/ -v
