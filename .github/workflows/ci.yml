name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-24.04
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Micromamba (Conda)
      uses: mamba-org/setup-micromamba@v1
      with:
        environment-name: freecad-env
        # 使用 conda-forge 安装 FreeCAD, Python 3.11, 以及测试依赖
        create-args: >-
          -c conda-forge
          freecad=0.21
          python=3.11
          pytest
          pytest-mock
          cadquery

    - name: Install cq_mod3d dependency
      shell: micromamba-shell {0}
      run: |
        # 注意：这里不需要 pip install . 因为它是一个 FreeCAD 插件，不是标准 Python 包
        # 我们只安装它依赖的 cq_mod3d 库
        pip install git+https://github.com/gwangcode/cq_mod3d.git

    - name: Run Tests with xvfb (Virtual Display)
      shell: micromamba-shell {0}
      env:
        # 强制让 pytest 在项目根目录下寻找模块（解决 ModuleNotFoundError: No module named 'utils'）
        PYTHONPATH: ${{ github.workspace }}
      run: |
        # FreeCAD 底层强依赖图形库，即使 Mock 了 Gui，也需要 xvfb 虚拟显示器
        xvfb-run -a pytest tests/ -v
