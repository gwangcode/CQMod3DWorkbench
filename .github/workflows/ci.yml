name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-24.04
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Micromamba (Conda)
      uses: mamba-org/setup-micromamba@v1
      with:
        environment-name: freecad-env
        create-args: >-
          -c conda-forge
          freecad=0.21
          python=3.11
          pytest
          pytest-mock
          numpy
          scipy
          trimesh
          shapely

    - name: Run Tests with xvfb
      shell: micromamba-shell {0}
      env:
        PYTHONPATH: ${{ github.workspace }}
        QT_QPA_PLATFORM: offscreen
        LD_LIBRARY_PATH: ${{ env.CONDA_PREFIX }}/lib
      run: |
        # 使用虚拟显示器跑纯 FreeCAD 原生测试
        xvfb-run -a pytest tests/ -v
