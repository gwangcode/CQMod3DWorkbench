name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-24.04
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Micromamba (Conda)
      uses: mamba-org/setup-micromamba@v1
      with:
        environment-name: freecad-env
        create-args: >-
          -c conda-forge
          freecad=0.21
          python=3.11
          pytest
          pytest-mock
          cadquery

    - name: Install cq_mod3d dependency
      shell: micromamba-shell {0}
      run: |
        pip install git+https://github.com/gwangcode/cq_mod3d.git

    - name: Run Tests with xvfb (Virtual Display)
      shell: micromamba-shell {0}
      run: |
        # 动态追加路径，绝不覆盖 Conda 环境自带的环境变量
        export PYTHONPATH=${{ github.workspace }}:$CONDA_PREFIX/lib/freecad/lib:$CONDA_PREFIX/lib:$PYTHONPATH
        export LD_LIBRARY_PATH=$CONDA_PREFIX/lib:$CONDA_PREFIX/lib/freecad/lib:$LD_LIBRARY_PATH
        export QT_QPA_PLATFORM=offscreen
        
        # 使用虚拟显示器运行测试
        xvfb-run -a pytest tests/ -v
