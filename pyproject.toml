[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mod3d_workbench"
version = "1.1.0"
description = "A pure FreeCAD interactive terminal for Mod3D."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Gang Wang" }
]
keywords = ["freecad", "3d", "cad", "terminal"]
dependencies = [
    "numpy",
    "scipy",
    "trimesh",
    "shapely"
]

[project.urls]
"Homepage" = "https://github.com/gwangcode/Mod3DWorkbench"
"Bug Tracker" = "https://github.com/gwangcode/Mod3DWorkbench/issues"
